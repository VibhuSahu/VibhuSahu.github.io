<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<!-- Coding Platforms Section Container -->
<div style="display: flex; flex-direction: column; gap: 24px; max-width: 920px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #ffffff; margin: 0 auto;">

  <!-- ==================== 1. LEETCODE CARD ==================== -->
  <div style="display: flex; align-items: center; justify-content: space-between; background-color: #1a1a1a; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 28px 36px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); flex-wrap: wrap; gap: 24px;">
    
    <!-- Left: Logo, Profile Avatar, Name, Handle & Rank -->
    <div style="display: flex; flex-direction: column; gap: 16px; min-width: 200px;">
      <!-- LeetCode Brand Logo -->
      <div style="display: flex; align-items: center; gap: 10px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16.102 17.93l-2.697 2.607c-.766.741-1.996.741-2.762 0l-6.8-6.568a2.022 2.022 0 010-2.819l6.8-6.568c.766-.741 1.996-.741 2.762 0l2.697 2.607" stroke="#ffa116" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 12h13" stroke="#eff1f6" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span style="font-weight: 800; font-size: 24px; color: #ffffff; letter-spacing: -0.5px;">LeetCode</span>
      </div>

      <!-- Avatar & Name Info -->
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 42px; height: 42px; background: linear-gradient(135deg, #2c2c2e, #1c1c1e); border: 1px solid #3a3a3c; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; color: #eff1f6;">P</div>
        <div>
          <div style="font-weight: 700; font-size: 17px; color: #ffffff;">PolarBear</div>
          <div style="font-size: 13px; color: #8a8a8e; margin-top: 2px;">PolarBear2003</div>
        </div>
      </div>

      <!-- Rank Badge Pill -->
      <div style="background-color: #262626; border: 1px solid #333333; padding: 6px 14px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; width: fit-content;">
        <span style="font-size: 13px; color: #8a8a8e; font-weight: 500;">Rank</span>
        <span style="font-size: 14px; color: #ffffff; font-weight: 700;">3,790,648</span>
      </div>
    </div>

    <!-- Center: Gauge Chart with Solved Count & Attempting -->
    <div style="position: relative; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center;">
      <svg width="140" height="140" viewBox="0 0 100 100" style="transform: rotate(-90deg);">
        <!-- Background Track -->
        <circle cx="50" cy="50" r="42" fill="none" stroke="#262626" stroke-width="8" />
        <!-- Easy Segment (Cyan) -->
        <circle cx="50" cy="50" r="42" fill="none" stroke="#00b8a3" stroke-width="8" stroke-dasharray="263.89" stroke-dashoffset="240" stroke-linecap="round" />
        <!-- Medium Segment (Yellow) -->
        <circle cx="50" cy="50" r="42" fill="none" stroke="#ffc01e" stroke-width="8" stroke-dasharray="263.89" stroke-dashoffset="258" stroke-linecap="round" />
      </svg>
      <div style="position: absolute; text-align: center; display: flex; flex-direction: column; align-items: center;">
        <div style="display: flex; align-items: baseline; gap: 2px;">
          <span style="font-size: 26px; font-weight: 800; color: #ffffff;">29</span>
          <span style="font-size: 12px; color: #8a8a8e; font-weight: 600;">/4087</span>
        </div>
        <div style="font-size: 12px; color: #00b8a3; font-weight: 700; margin-top: 2px; display: flex; align-items: center; gap: 3px;">
          ✓ Solved
        </div>
        <div style="font-size: 11px; color: #8a8a8e; margin-top: 4px; font-weight: 500;">
          <strong style="color: #ffffff;">2</strong> Attempting
        </div>
      </div>
    </div>

    <!-- Right: Difficulty Breakdown Pill Cards -->
    <div style="display: flex; flex-direction: column; gap: 10px; width: 180px;">
      <!-- Easy -->
      <div style="background-color: #262626; border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;">
        <span style="color: #00b8a3; font-weight: 700; font-size: 14px;">Easy</span>
        <div><strong style="color: #ffffff; font-size: 15px;">24</strong><span style="color: #8a8a8e; font-size: 13px;">/972</span></div>
      </div>
      <!-- Medium -->
      <div style="background-color: #262626; border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;">
        <span style="color: #ffc01e; font-weight: 700; font-size: 14px;">Med.</span>
        <div><strong style="color: #ffffff; font-size: 15px;">5</strong><span style="color: #8a8a8e; font-size: 13px;">/2131</span></div>
      </div>
      <!-- Hard -->
      <div style="background-color: #262626; border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;">
        <span style="color: #ff375f; font-weight: 700; font-size: 14px;">Hard</span>
        <div><strong style="color: #ffffff; font-size: 15px;">0</strong><span style="color: #8a8a8e; font-size: 13px;">/984</span></div>
      </div>
    </div>

  </div>


  <!-- ==================== 2. HACKERRANK CARD ==================== -->
  <div style="display: flex; align-items: center; justify-content: space-between; background-color: #1a1a1a; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 28px 36px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); flex-wrap: wrap; gap: 24px;">
    
    <!-- Left Side: User Info & HackerRank Brand Badge -->
    <div style="display: flex; flex-direction: column; align-items: flex-start; min-width: 180px;">
      <div style="background-color: #0d1724; padding: 6px 14px; border-radius: 6px; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#00ea64"/>
          <path d="M2 17L12 22L22 17" stroke="#00ea64" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="#00ea64" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span style="font-weight: 800; font-size: 15px; color: #ffffff; letter-spacing: -0.3px;">HackerRank</span>
      </div>
      <h2 style="margin: 0; font-size: 26px; font-weight: 700; color: #ffffff; letter-spacing: -0.5px; line-height: 1.2;">Vibhu Sahu</h2>
      <span style="font-size: 14px; color: #8a8a8e; margin-top: 4px; font-weight: 500;">@vibhu6751</span>
    </div>

    <!-- Right Side: Hexagon Skill Badges -->
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">

      <!-- 1. C++ (Gold - 5 Stars) -->
      <div style="width: 100px; height: 115px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3)); transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-4px)'" onmouseout="this.style.transform='translateY(0)'">
        <svg viewBox="0 0 100 115" width="100%" height="100%">
          <defs>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffd23f"/>
              <stop offset="100%" stop-color="#e68a00"/>
            </linearGradient>
            <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#b2bec3"/>
            </linearGradient>
            <linearGradient id="coralGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffab91"/>
              <stop offset="100%" stop-color="#ff5252"/>
            </linearGradient>
          </defs>
          <polygon points="50 3, 95 28, 95 87, 50 112, 5 87, 5 28" fill="url(#goldGrad)" stroke="#ffd23f" stroke-width="2"/>
          <g fill="#1a1d24">
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(21, 28) rotate(-30)" />
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(35.5, 20) rotate(-15)" />
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(50, 17) rotate(0)" />
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(64.5, 20) rotate(15)" />
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(79, 28) rotate(30)" />
          </g>
          <text x="50" y="68" text-anchor="middle" fill="#1a1d24" font-size="16" font-weight="900" font-family="-apple-system, sans-serif">C++</text>
        </svg>
      </div>

      <!-- 2. Java (Silver - 3 Stars) -->
      <div style="width: 100px; height: 115px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3)); transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-4px)'" onmouseout="this.style.transform='translateY(0)'">
        <svg viewBox="0 0 100 115" width="100%" height="100%">
          <polygon points="50 3, 95 28, 95 87, 50 112, 5 87, 5 28" fill="url(#silverGrad)" stroke="#ffffff" stroke-width="2"/>
          <g fill="#1a1d24">
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(21, 28) rotate(-30)" />
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(35.5, 20) rotate(-15)" />
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(50, 17) rotate(0)" />
          </g>
          <g stroke="#1a1d24" stroke-width="1.2" fill="none">
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(64.5, 20) rotate(15)" />
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(79, 28) rotate(30)" />
          </g>
          <text x="50" y="68" text-anchor="middle" fill="#1a1d24" font-size="16" font-weight="900" font-family="-apple-system, sans-serif">Java</text>
        </svg>
      </div>

      <!-- 3. Python (Gold - 5 Stars) -->
      <div style="width: 100px; height: 115px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3)); transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-4px)'" onmouseout="this.style.transform='translateY(0)'">
        <svg viewBox="0 0 100 115" width="100%" height="100%">
          <polygon points="50 3, 95 28, 95 87, 50 112, 5 87, 5 28" fill="url(#goldGrad)" stroke="#ffd23f" stroke-width="2"/>
          <g fill="#1a1d24">
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(21, 28) rotate(-30)" />
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(35.5, 20) rotate(-15)" />
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(50, 17) rotate(0)" />
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(64.5, 20) rotate(15)" />
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(79, 28) rotate(30)" />
          </g>
          <text x="50" y="68" text-anchor="middle" fill="#1a1d24" font-size="15" font-weight="900" font-family="-apple-system, sans-serif">Python</text>
        </svg>
      </div>

      <!-- 4. Sql (Coral - 2 Stars) -->
      <div style="width: 100px; height: 115px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3)); transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-4px)'" onmouseout="this.style.transform='translateY(0)'">
        <svg viewBox="0 0 100 115" width="100%" height="100%">
          <polygon points="50 3, 95 28, 95 87, 50 112, 5 87, 5 28" fill="url(#coralGrad)" stroke="#ffab91" stroke-width="2"/>
          <g fill="#1a1d24">
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(21, 28) rotate(-30)" />
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(35.5, 20) rotate(-15)" />
          </g>
          <g stroke="#1a1d24" stroke-width="1.2" fill="none">
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(50, 17) rotate(0)" />
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(64.5, 20) rotate(15)" />
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(79, 28) rotate(30)" />
          </g>
          <text x="50" y="68" text-anchor="middle" fill="#1a1d24" font-size="16" font-weight="900" font-family="-apple-system, sans-serif">Sql</text>
        </svg>
      </div>

      <!-- 5. C language (Silver - 3 Stars) -->
      <div style="width: 100px; height: 115px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3)); transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-4px)'" onmouseout="this.style.transform='translateY(0)'">
        <svg viewBox="0 0 100 115" width="100%" height="100%">
          <polygon points="50 3, 95 28, 95 87, 50 112, 5 87, 5 28" fill="url(#silverGrad)" stroke="#ffffff" stroke-width="2"/>
          <g fill="#1a1d24">
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(21, 28) rotate(-30)" />
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(35.5, 20) rotate(-15)" />
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(50, 17) rotate(0)" />
          </g>
          <g stroke="#1a1d24" stroke-width="1.2" fill="none">
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(64.5, 20) rotate(15)" />
            <path d="M 0,-5.2 L 1.5,-1.6 L 5.2,-1.6 L 2.2,0.6 L 3.3,4.2 L 0,2 L -3.3,4.2 L -2.2,0.6 L -5.2,-1.6 L -1.5,-1.6 Z" transform="translate(79, 28) rotate(30)" />
          </g>
          <text x="50" y="60" text-anchor="middle" fill="#1a1d24" font-size="18" font-weight="900" font-family="-apple-system, sans-serif">C</text>
          <text x="50" y="75" text-anchor="middle" fill="#1a1d24" font-size="12" font-weight="800" font-family="-apple-system, sans-serif">language</text>
        </svg>
      </div>

    </div>
  </div>

</div>

<script src="./JS/script.js"></script>
    
</body>
</html>

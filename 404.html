<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PolarBear - PageNotFound</title>
    <link rel="icon" type="image/x-icon" href="./assets/logo.png" />
    <link rel="stylesheet" href="/CSS/styles.css" />
    <link rel="stylesheet" href="/CSS/lottieStyle.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  </head>
  <body>
    <main class="not-found">
      <h1 style="text-decoration: underline; font-size: clamp(1rem, 2.5vw + 0.5rem, 1.5rem); font-weight: 300; color: var(--tertiary-text-color); padding-top: 10%;">
        <a href="https://vibhusahu.github.io" style="color: inherit; text-decoration: underline;">
            https://vibhusahu.github.io
        </a>
      </h1>
      <div
        id="not-found-animation"
        class="lottie"
        role="img"
        aria-label="Page not found animation"
      ></div>

      <h2 style="text-decoration: none; font-size: clamp(1.5rem, 4vw + 0.5rem, 3rem); padding-bottom: 10%; font-weight: 600; color: var(--primary-color); -webkit-text-stroke: 2px var(--tertiary-text-color);">Page Not Found</h2>
    </main>

    <script>
      lottie.loadAnimation({
        container: document.getElementById("not-found-animation"),
        renderer: "svg",
        loop: true,
        autoplay: true,
        path: "/assets/404Page/404Animation.json",
      });
    </script>
  </body>
</html>
